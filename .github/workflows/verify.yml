name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check private-data boundary
        run: ./tools/check-public-tree.sh --tracked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test plugin
        run: ./build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-prototype/package-lock.json

      - name: Build web map
        working-directory: web-prototype
        run: |
          npm ci
          npm run build
