name: 驗證

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 檢查私密資料邊界
        run: ./tools/check-public-tree.sh --tracked

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 取得公開角色扮演引擎
        uses: actions/checkout@v5
        with:
          repository: mlgzackfly/persistent-rpg-engine
          ref: v0.1.0
          path: persistent-rpg-engine

      - name: 建置並測試插件
        env:
          RPG_ENGINE_DIR: ${{ github.workspace }}/persistent-rpg-engine
        run: ./build.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-prototype/package-lock.json

      - name: 建置網頁地圖
        working-directory: web-prototype
        run: |
          npm ci
          npm run build
