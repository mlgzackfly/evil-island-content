# 地圖由插件建立在獨立世界，不覆蓋原版 world。
database:
  autosave-ticks: 100
  backup-retention: 10

# 每個現實日推進一日；四週後保留城況並進入下一輪。
campaign:
  time-zone: Asia/Taipei

# 公共工程使用展示實體呈現，不會覆蓋既有精緻建築方塊。
development:
  visual-radius: 58.0
  construction:
    # 實體工程逐批放置；若地塊被道路或既有建築占用則不施工。
    blocks-per-tick: 80

diplomacy:
  # 全服庫存有限；個人額度只由對應任務取得，每週重置。
  weekly-stock: 4
  personal-credit-cap: 3

telemetry:
  # 回流補給只提供基礎食物，每輪最多一次，不補永久成長。
  catchup-after-hours: 72
  catchup-bread: 4

acceptance:
  # 管理驗收預覽會分批放置，十分鐘後自動按快照復原。
  blocks-per-tick: 120
  preview-ticks: 12000
  retained-runs: 5
  dynmap-url: http://127.0.0.1:8123/
  dynmap-map: surface

# 非戰鬥任務只恢復炁息並推進城況，不直接提供妖質或永久戰力。
missions:
  field-qi-reward: 20
  gather:
    amount-multiplier: 1.0
    duo-multiplier: 1.5
  scout:
    marker-particles: 2
  actor:
    follow-distance: 4.5
    teleport-distance: 24.0
    follow-speed: 1.08
  escort:
    arrival-radius: 7.0
  rescue:
    return-radius: 8.0
  field-ambush:
    spawn-radius: 7.0
  defense:
    entry-distance: 24.0
    fortification-distance: 11.0
    fortification-health: 3
    fortification-damage-interval-ms: 3000
    repair-material: COBBLESTONE
    intermission-ticks: 80
    breach-radius: 5.0
    max-breaches: 3

atlas:
  world-name: evil_island_hd
  palace-realm-name: evil_island_hd_palace_realm
  coordinate-scale: 2
  seed: 4290053
  border-size: 12000
  create-palace-realm: true
  auto-enter-new-players: true

# 新城座標由世界圖譜自動寫入；setup 僅保留給測試世界。
new-city:
  city-radius: 24
  buffer-radius: 72
  mirror-radius: 6

# 道息是環境值，不儲存在玩家身上。
dao:
  city: 12
  buffer: 43
  wilderness: 82
  mirror-field: 67

# 炁息是玩家施展炁訣時消耗的資源，恢復速度由所在地道息決定。
qi:
  base-regen: 0.5
  dao-regen-factor: 0.04

abilities:
  bao:
    cost: 24
    cooldown-ms: 2400
    radius: 5.0
    damage: 8.0
  qing:
    cost: 9
    cooldown-ms: 900
  rou:
    cost: 14
    cooldown-ms: 2600
    guard-ms: 2400
  ning:
    cost: 20
    cooldown-ms: 3200

progression:
  first-transformation-essence: 3
  first-transformation-success: 1.0
  low-dao-threshold: 20
  low-dao-qi-drain: 2

# 玩家透過撼山巡防員的場景選單組成一至兩人隊伍。
patrol-party:
  assembly-radius: 12.0
  invite-timeout-ms: 15000
  scaling:
    zaochi-per-extra-player: 2
    zaochi-health-per-extra-player: 0.35
    zaochi-damage-per-extra-player: 0.12
    boss-health-per-extra-player: 0.45
    boss-damage-per-extra-player: 0.15

# 單人巡防的揚武 NPC。倒地期間不會被妖族繼續鎖定。
companions:
  follow:
    distance: 6.0
    teleport-distance: 26.0
    speed: 1.12
  yangwu:
    health: 56.0
    attack: 5.0
    speed: 0.30
    target-range: 20.0
    downed-ms: 12000
    rescue-health-ratio: 0.55
    auto-recover-health-ratio: 0.35
  # 無跡提供追蹤與引路，不作為第二名戰鬥玩家。
  wuji:
    health: 36.0
    speed: 0.34

# NPC 疲勞會隨現實時間恢復；治療由巡防公告介面完成。
npc-roster:
  fatigue-limit: 80
  mission-fatigue: 18
  abort-fatigue: 6
  fatigue-recovery-interval-ms: 600000
  injury-duration-ms: 1800000
  treatment-material: HONEY_BOTTLE
  treatment-amount: 1
  treatment-fatigue-relief: 35
  solo-no-support-enemy-reduction: 1
  solo-no-support-combat-multiplier: 0.90

encounters:
  patrol:
    zaochi-count: 3
  # 共用目標、尋路與脫戰規則。
  ai:
    leash-distance: 42.0
    disengage-ms: 10000
    repath-ms: 900
    return-speed: 1.15
  zaochi:
    health: 34.0
    attack: 6.0
    speed: 0.30
    target-range: 30.0
    group-radius: 9.0
    flank-distance: 3.4
    wounded-threshold: 0.28
    leap-min-range: 5.0
    leap-max-range: 12.0
    leap-windup-ms: 650
    leap-cooldown-min-ms: 3000
    leap-cooldown-random-ms: 1600
    leap-damage: 5.0
  xingtian:
    health: 140.0
    attack: 13.0
    speed: 0.27
    target-range: 42.0
    command-radius: 13.0
    enraged-threshold: 0.45
    enraged-cooldown-multiplier: 0.72
    slam-radius: 4.5
    slam-windup-ms: 1050
    slam-cooldown-ms: 5400
    slam-damage: 8.0
    charge-min-range: 7.0
    charge-max-range: 18.0
    charge-windup-ms: 800
    charge-cooldown-ms: 6800
    charge-damage: 10.0
  quanrong:
    health: 28.0
    attack: 5.0
  quanrong-alpha:
    health: 90.0
    attack: 9.0
  yujiang:
    health: 24.0
    attack: 5.0
  yujiang-elite:
    health: 52.0
    attack: 7.0
